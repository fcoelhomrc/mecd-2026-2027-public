<style>

  @font-face {
    font-family: "Lora"; font-style: normal; font-weight: 400 700;
    font-display: swap; src: url("./L1_sampling/assets/Lora-VariableFont_wght-CZceb_kH.woff2") format("woff2");
  }
  @font-face {
    font-family: "PT Sans"; font-style: normal; font-weight: 400;
    font-display: swap; src: url("./L1_sampling/assets/PTSans-Regular-Bam3NpBI.woff2") format("woff2");

  @font-face {
    font-family: "PT Sans"; font-style: normal; font-weight: 700;
    font-display: swap; src: url("./L1_sampling/assets/PTSans-Bold-C_DwAp7Z.woff2") format("woff2");
  }

  /* Tokens lifted from marimo's own stylesheet so the index and the
     notebooks it links to are the same surface. */
  :root {
    --background: #ffffff;
    --foreground: #0f172a;
    --muted-foreground: #64748b;
    --border: #e2e8f0;
    --primary: #0880ea;
    --heading-font: "Lora", serif;
    --text-font: "PT Sans", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: #181c1a;
      --foreground: #eceeed;
      --muted-foreground: #aab2af;
      --border: #3b403e;
      --primary: #28879f;
    }
  }
  * { box-sizing: border-box; }
  body {
    background: var(--background);
    color: var(--foreground);
    font-family: var(--text-font);
    margin: 0;
  }
  .container {
    max-width: 42rem;
    margin: 0 auto;
    padding: 6rem 1.5rem 4rem;
  }
  @media (max-width: 640px) {
    .container { padding: 3.5rem 1.25rem 3rem; }
  }
  h1 {
    font-family: var(--heading-font);
    font-size: clamp(2rem, 5vw, 2.5rem);
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -0.01em;
    margin: 0 0 2.5rem;
  }
  .list { border-top: 1px solid var(--border); }
  .item {
    display: flex;
    align-items: baseline;
    gap: 0.85rem;
    padding: 1.35rem 0.25rem;
    border-bottom: 1px solid var(--border);
    text-decoration: none;
    color: inherit;
  }
  .item-index {
    font-variant-numeric: tabular-nums;
    color: var(--muted-foreground);
    font-size: 0.9rem;
    flex-shrink: 0;
  }
  .item-title {
    font-family: var(--heading-font);
    font-size: 1.2rem;
    font-weight: 700;
    transition: color 0.15s ease;
  }
  .item-arrow {
    margin-left: auto;
    color: var(--muted-foreground);
    flex-shrink: 0;
    transition: transform 0.15s ease, color 0.15s ease;
  }
  .item:hover .item-title, .item:hover .item-arrow { color: var(--primary); }
  .item:hover .item-arrow { transform: translateX(3px); }
  .empty { color: var(--muted-foreground); padding: 1.35rem 0; }
</style>
